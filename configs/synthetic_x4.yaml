seed: 42

model:
  scale: 4
  num_in_ch: 3
  num_out_ch: 3
  num_feat: 64
  num_block: 50
  num_grow_ch: 32
  kernel_sizes: [3, 5, 7]
  enable_scale_attn: false
  global_block_type: ssgm
  global_res_scale: 0.1
  window_size: 8
  num_heads: 4
  d_state: 16

normalization:
  mean: [0.5, 0.5, 0.5]
  std: [0.5, 0.5, 0.5]

data:
  mode: synthetic
  num_workers: 4
  train:
    hr_dir: datasets/WHU-RS19/train
    hr_patch_size: 256
    batch_size: 4
  val:
    hr_dir: datasets/WHU-RS19/val
    batch_size: 1
  test:
    hr_dir: datasets/WHU-RS19/test
    batch_size: 1

degradation:
  train:
    blur_kernel: 21
    blur_type: aniso_gaussian
    sig_min: 0.6
    sig_max: 2.8
    lambda_min: 0.6
    lambda_max: 3.0
    noise: 10
  val:
    blur_kernel: 21
    blur_type: iso_gaussian
    sig: 1.2
    noise: 0
  test:
    blur_kernel: 21
    blur_type: iso_gaussian
    sig: 1.2
    noise: 0

training:
  epochs: 1000
  amp: true
  save_every: 100
  early_stop_patience: 200
  optimizer:
    lr: 0.0001
    betas: [0.9, 0.999]
    milestones: [200, 400, 600, 800]
    gamma: 0.5
